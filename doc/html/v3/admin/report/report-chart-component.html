<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Grafik Skor Komponen | PolicyEval</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "surface-container-lowest": "#ffffff", "on-primary": "#ffffff", "surface": "#f4fbf4",
          "on-background": "#161d19", "secondary-container": "#dfe0e0", "surface-variant": "#dde4dd",
          "surface-container-low": "#eef6ee", "surface-container-high": "#e3eae3", "on-primary-container": "#00422b",
          "outline": "#6c7a71", "background": "#f4fbf4", "secondary": "#5d5f5f", "inverse-primary": "#4edea3",
          "surface-container": "#e8f0e9", "surface-tint": "#006c49", "outline-variant": "#c4bcaa", "error": "#ba1a1a",
          "on-surface-variant": "#3c4a42", "primary-container": "#10b981", "on-surface": "#161d19",
          "primary": "#006c49", "on-secondary": "#ffffff"
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: { sm: "0.5rem", gutter: "1.5rem", "2xl": "3rem", base: "4px", md: "1rem", xs: "0.25rem", lg: "1.5rem", xl: "2rem" },
        fontFamily: { "headline-xl": ["Poppins"], "headline-lg": ["Poppins"], "title-md": ["Poppins"], "body-base": ["Poppins"], "body-sm": ["Poppins"], "label-caps": ["Poppins"] },
        fontSize: {
          "headline-xl": ["36px",{lineHeight:"1.2",letterSpacing:"-0.02em",fontWeight:"600"}],
          "headline-lg": ["30px",{lineHeight:"1.3",letterSpacing:"-0.01em",fontWeight:"600"}],
          "label-caps": ["12px",{lineHeight:"1",letterSpacing:"0.05em",fontWeight:"600"}],
          "title-md": ["20px",{lineHeight:"1.5",fontWeight:"500"}],
          "body-base": ["16px",{lineHeight:"1.6",fontWeight:"400"}],
          "body-sm": ["14px",{lineHeight:"1.5",fontWeight:"400"}]
        }
      }}
    }
  </script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .custom-dropdown { transition: all 0.3s ease; cursor: pointer; }
    .custom-dropdown:hover { background-color: #eef6ee; }
    .custom-dropdown:focus { outline: none; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }

    .dd-panel {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff;
      border: 1px solid rgba(196,188,170,0.5); border-radius: 0.75rem; box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      z-index: 50; display: none; overflow: hidden; animation: panelIn 0.15s ease-out;
    }
    .dd-panel.open { display: block; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .dd-opt { padding: 10px 14px; font-size: 13px; color: #161d19; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
    .dd-opt:hover { background: #eef6ee; }
    .dd-opt.selected { background: rgba(16,185,129,0.1); color: #006c49; font-weight: 600; border-left-color: #006c49; }

    .chart-card { transition: all 0.3s ease; }
    .chart-card:hover { box-shadow: 0 10px 30px rgba(0,108,73,0.08); transform: translateY(-2px); }

    .bar-group { transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.05); }
    .chart-bar { transition: height 0.6s cubic-bezier(0.175,0.885,0.32,1.1); }
    .bar-value { transition: transform 0.2s; }
    .bar:hover .bar-value { transform: scale(1.15); }

    .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
    .fade-in-delay { animation: fadeIn 0.5s ease-out 0.15s forwards; opacity: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .filter-label { font-size: 10px; font-weight: 600; color: #6c7a71; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

  <!-- SIDEBAR -->
  <aside class="fixed left-0 top-0 h-full w-[280px] bg-surface border-r border-outline-variant/30 flex flex-col py-6 z-50">
    <div class="px-6 mb-8 flex items-center gap-3">
      <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">eco</span>
      </div>
      <div>
        <h1 class="text-[20px] font-bold text-primary leading-none">PolicyEval</h1>
        <p class="text-[12px] text-secondary mt-1">Environmental Admin</p>
      </div>
    </div>
    <nav class="flex-1 space-y-1">
      <div class="pt-4 pb-1 px-6"><p class="text-label-caps text-on-surface-variant uppercase tracking-wider">Pelaksanaan</p></div>
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container transition-all" href="#"><span class="material-symbols-outlined">groups</span><span class="text-body-sm">Responden</span></a>
      <a class="flex items-center gap-3 bg-surface-container-high text-primary font-bold border-l-4 border-primary py-3 px-6" href="#"><span class="material-symbols-outlined">assessment</span><span class="text-body-sm">Reports</span></a>
      <div class="pt-4 mt-4 border-t border-outline-variant/20">
        <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container transition-all" href="#"><span class="material-symbols-outlined">settings</span><span class="text-body-sm">Settings</span></a>
      </div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="ml-[280px] p-8 max-w-[1440px] w-full mx-auto">
    <nav class="mb-2 flex items-center gap-2 text-sm">
      <a href="#" class="text-primary font-medium hover:underline">Reports</a>
      <span class="text-outline">/</span>
      <span class="text-outline">Grafik Skor Komponen</span>
    </nav>

    <!-- Instrument card: nama saja (belum ada flow multiple-questionnaire) -->
    <div class="bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 mb-6 fade-in-delay flex items-center gap-4">
      <span class="material-symbols-outlined text-primary text-[34px]">assignment</span>
      <div>
        <p class="filter-label mb-0.5">Instrument Penelitian</p>
        <h3 id="qTitle" class="font-semibold text-on-surface text-[20px] leading-snug"></h3>
      </div>
    </div>

    <!-- Charts grid (5 cards) -->
    <div id="chartsWrap" class="hidden">
      <div class="flex items-center justify-between mb-4 fade-in">
        <p class="text-on-surface-variant text-body-sm"><span class="material-symbols-outlined align-middle text-[16px]">info</span> Skor tersusun dari jumlah skor seluruh pernyataan tiap komponen</p>
        <span class="text-[11px] text-outline" id="generatedAt"></span>
      </div>
      <div id="chartsGrid" class="grid grid-cols-1 gap-6">
        <!-- injected per component -->
      </div>
    </div>
  </div>

  <!-- JS mock data & renderer -->
  <script>
    const TITLES = ["SANGAT_TIDAK_SESUAI", "TIDAK_SESUAI", "CUKUP_SESUAI", "SESUAI", "SANGAT_SESUAI"];
  const TITLE_LABELS = ["Sangat Tidak Sesuai", "Tidak Sesuai", "Cukup Sesuai", "Sesuai", "Sangat Sesuai"];
  const TITLE_COLORS = ["#dc2626", "#f97316", "#f59e0b", "#10b981", "#006c49"];

  // mock questionnaire -> components[ {name, dist[5] counts
  const QUESTIONNAIRES = [
    {
      id: 1, title: "Evaluasi Penggunaan Energi 2024", status: "published", respondents: 18,
      components: [
        { name: "Energi: Konsumsi Listrik", dist: [2, 3, 5, 5, 3] },
        { name: "Energi: Sumber Energi Sinar", dist: [1, 2, 4, 6, 5] },
        { name: "Air: Konsumsi Air Bersih",  dist: [3, 3, 4, 5, 3] },
        { name: "Pembelajaran Efisiensi Energi", dist: [0, 2, 5, 8, 3] },
        { name: "Keberlanjutan Program", dist: [1, 1, 6, 6, 4] },
      ]
    },
    {
      id: 2, title: "Evaluasi Kebijakan Lingkungan Sekolah 2025", status: "published", respondents: 24,
      components: [
        { name: "Kebijakan Sekolah Adiwiyata", dist: [1, 3, 5, 9, 6] },
        { name: "Pengelolaan Sampah & Limbah", dist: [2, 5, 7, 6, 4] },
        { name: "Penghijauan Lingkungan", dist: [0, 2, 6, 10, 6] },
        { name: "Perilaku & Partisipasi Warga Sekolah", dist: [3, 4, 6, 7, 4] },
        { name: "Penigkatan Mutu Pembiakan", dist: [1, 3, 5, 9, 6] },
      ]
    },
    {
      id: 3, title: "Evaluasi Budaya Literasi Digital", status: "published", respondents: 12,
      components: [
        { name: "Akses Sarana TIK", dist: [3, 3, 3, 2, 1] },
        { name: "Keterampilan Digital Guru", dist: [1, 4, 5, 2, 0] },
        { name: "E-Safety & Etika Digital", dist: [2, 2, 5, 3, 0] },
        { name: "Pemanfaatan Platform Pembelajaran", dist: [1, 3, 6, 2, 0] },
        { name: "Evaluasi & Monitoring Literasi", dist: [4, 3, 3, 2, 0] },
      ]
    }
  ];

  // ---- Render: ambil instrument published pertama (hardcode, belum ada flow multiple-questionnaire) ----
  const qn = QUESTIONNAIRES.find(x => x.status === 'published');
  document.getElementById('qTitle').textContent = qn.title;
  document.getElementById('generatedAt').textContent = 'Diperbarui ' + new Date().toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
  document.getElementById('chartsWrap').classList.remove('hidden');
  renderCharts(qn);

  function renderCharts(qn) {
    const grid = document.getElementById('chartsGrid');
    grid.innerHTML = '';
    qn.components.forEach((comp, idx) => {
      const max = Math.max(...comp.dist, 1);
      const total = comp.dist.reduce((a,b)=>a+b,0);
      const topIdx = comp.dist.indexOf(Math.max(...comp.dist));

      const card = document.createElement('div');
      card.className = 'chart-card bg-white rounded-xl shadow-sm border border-outline-variant/20 p-6 fade-in';

      let bars = '';
      comp.dist.forEach((c, i) => {
        const h = Math.max(4, Math.round((c/max)*100));
        const focus = i===topIdx;
        bars += `
          <div class="flex-1 flex flex-col items-center justify-end h-[220px] bar group">
            <div class="text-[12px] font-bold text-on-surface transition-all bar-value">${c}</div>
            <div class="w-full max-w-[46px] rounded-t-lg bar" style="height:${h}%;background:${TITLE_COLORS[i]};opacity:${c?'1':'.25'}"></div>
            <div class="text-[9px] text-on-surface-variant text-center mt-2 leading-tight truncate w-full px-1" title="${TITLE_LABELS[i]}">${TITLE_LABELS[i]}</div>
          </div>`;
      });

      card.innerHTML = `
        <div class="flex items-start justify-between mb-3 px-1">
          <div>
            <h3 class="font-semibold text-on-surface text-[15px]">${comp.name}</h3>
            <p class="text-[11px] text-on-surface-variant mt-0.5">Component ${idx+1} · ${total} response</p>
          </div>
          <div class="flex items-center gap-1.5 text-[11px] font-semibold">
            <span class="w-2.5 h-2.5 rounded-full" style="background:${TITLE_COLORS[topIdx]}"></span>
            Dominan: ${TITLE_LABELS[topIdx]}
          </div>
        </div>
        <div class="flex items-end gap-2 h-[260px] px-1">
          <div class="flex flex-col justify-between h-full mr-1 text-[10px] text-outline pr-1" style="writing-mode:horizontal-tb">
            <span>${max}</span><span>${Math.round(max*0.75)}</span><span>${Math.round(max*0.5)}</span><span>${Math.round(max*0.25)}</span><span>0</span>
          </div>
          <div class="flex items-end gap-2 flex-1 h-full border-b border-l border-outline-variant/40">
            ${bars}
          </div>
        </div>
        <div class="flex items-center gap-2 mt-4 text-[11px] text-on-surface-variant px-1 pt-3 border-t border-outline-variant/10">
          <span class="material-symbols-outlined text-[14px]">analytics</span>
          <span>Kategori terbanyak: <b class="text-on-surface">${TITLE_LABELS[topIdx]}</b> (${comp.dist[topIdx]} dari ${total} response)</span>
        </div>`;
      grid.appendChild(card);
    });
  }

  // Default: anggap sudah milih instrument pertama → langsung tampilkan 5 grafik
  selectQn(QUESTIONNAIRES[0].id);
  function renderEmpty(){ document.getElementById('chartsWrap').classList.add('hidden'); document.getElementById('emptyState').classList.remove('hidden'); }
  </script>
</body>
</html>
